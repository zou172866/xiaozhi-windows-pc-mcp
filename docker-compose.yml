services:
  anima-brain:
    build:
      context: ./anima-brain
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${ANIMA_BUILD_VERSION:-dev}
        DOCKER_MIRROR_PREFIX: ${DOCKER_MIRROR_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: xiaozhi-anima-brain:local
    container_name: xiaozhi-anima-brain
    restart: always
    stop_grace_period: 25s
    env_file:
      # A-1 最小权限：anima-brain 仅接收自身 ANIMA_STUDIO_TOKEN，严禁注入 PC_MCP_TOKEN
      - path: ./secrets/anima_tokens.env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=2
      - ANIMA_PORT=18787
      - ANIMA_DATA_DIR=/data/anima
      - ANIMA_DEFAULT_CHARACTER=xiaozhi
      - ANIMA_LAN_IP=${HOST_LAN_IP:-127.0.0.1}
      - COMPANION_TIMEOUT_SECONDS=${ANIMA_TIMEOUT_SECONDS:-150}
      - ANIMA_SUMMARY_BATCH_MESSAGES=${ANIMA_SUMMARY_BATCH_MESSAGES:-8}
      - ANIMA_RECALL_EMBED_TIMEOUT_SECONDS=${ANIMA_RECALL_EMBED_TIMEOUT_SECONDS:-0.12}
      # 记忆大脑默认走国内直连 DeepSeek（留空 ANIMA_EMBEDDING_* 即纯本地 FTS5，不回落 Google Gemini）；
      # 若需使用 Google Gemini 或其他兼容接口，在 .env 中设置 ANIMA_LLM_* / ANIMA_EMBEDDING_*，按 URL 自动匹配对应密钥
      - ANIMA_LLM_BASE_URL_EXPLICIT=${ANIMA_LLM_BASE_URL:-}
      - ANIMA_LLM_API_KEY_EXPLICIT=${ANIMA_LLM_API_KEY:-}
      - ANIMA_SUMMARY_BASE_URL_EXPLICIT=${ANIMA_SUMMARY_BASE_URL:-}
      - ANIMA_SUMMARY_API_KEY_EXPLICIT=${ANIMA_SUMMARY_API_KEY:-}
      - ANIMA_EMBEDDING_API_KEY_EXPLICIT=${ANIMA_EMBEDDING_API_KEY:-}
      - ANIMA_FALLBACK_DEEPSEEK_KEY=${DEEPSEEK_API_KEY:-}
      - ANIMA_FALLBACK_GEMINI_KEY=${GEMINI_API_KEY:-}
      - COMPANION_BASE_URL=${ANIMA_LLM_BASE_URL:-https://api.deepseek.com/v1}
      - COMPANION_MODEL=${ANIMA_LLM_MODEL:-deepseek-chat}
      - COMPANION_API_KEY=${ANIMA_LLM_API_KEY:-}
      - COMPANION_SUMMARY_BASE_URL=${ANIMA_SUMMARY_BASE_URL:-${ANIMA_LLM_BASE_URL:-https://api.deepseek.com/v1}}
      - COMPANION_SUMMARY_MODEL=${ANIMA_SUMMARY_MODEL:-${ANIMA_LLM_MODEL:-deepseek-chat}}
      - COMPANION_SUMMARY_KEY=${ANIMA_SUMMARY_API_KEY:-}
      - COMPANION_EMBEDDING_BASE_URL=${ANIMA_EMBEDDING_BASE_URL:-}
      - COMPANION_EMBEDDING_MODEL=${ANIMA_EMBEDDING_MODEL:-}
      - COMPANION_EMBEDDING_KEY=${ANIMA_EMBEDDING_API_KEY:-}
      - COMPANION_EMBEDDING_DIMENSIONS=${ANIMA_EMBEDDING_DIMENSIONS:-}
      - OBSIDIAN_SYNC_ENABLED=${OBSIDIAN_SYNC_ENABLED:-false}
      - OBSIDIAN_BRIEFING_ENABLED=${OBSIDIAN_BRIEFING_ENABLED:-true}
      - OBSIDIAN_BRIEFING_INTERVAL_SECONDS=${OBSIDIAN_BRIEFING_INTERVAL_SECONDS:-3600}
      - ANIMA_DREAM_ENABLED=${ANIMA_DREAM_ENABLED:-true}
      - ANIMA_DREAM_INTERVAL_SECONDS=${ANIMA_DREAM_INTERVAL_SECONDS:-21600}
      - ANIMA_RECALL_SENSITIVE_FILTER=${ANIMA_RECALL_SENSITIVE_FILTER:-true}
      - OBSIDIAN_EXPORT_DIR=/obsidian
      - OBSIDIAN_HOST_DIR=${OBSIDIAN_EXPORT_DIR:-./data/obsidian_export}
      - OBSIDIAN_SNAPSHOT_INTERVAL_SECONDS=${OBSIDIAN_SNAPSHOT_INTERVAL_SECONDS:-600}
      - NO_PROXY=localhost,127.0.0.1,anima-brain,xiaozhi-anima-brain,xiaozhi-esp32-server,host.docker.internal,.deepseek.com,.siliconflow.cn,.aliyuncs.com,.bytedance.com,.minimaxi.com,.nmc.cn
      - no_proxy=localhost,127.0.0.1,anima-brain,xiaozhi-anima-brain,xiaozhi-esp32-server,host.docker.internal,.deepseek.com,.siliconflow.cn,.aliyuncs.com,.bytedance.com,.minimaxi.com,.nmc.cn
      # 如果未开启全局 TUN 代理，可取消下面两行注释填写宿主机代理端口（本地回环与宿主机桥接已在上方 NO_PROXY 中直连排除）：
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
    ports:
      # Companion Studio 网页控制台端口（仅绑定本机回环，防止局域网暴露）
      - "127.0.0.1:18787:18787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:18787/xiaozhi/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 持久化 Anima Brain SQLite 数据库与访问令牌（仅挂载给 anima-brain，主容器完全不可见，A-1）
      # H-3: 已移除全部单文件 :ro 源码覆盖挂载（避免镜像漂移与 Windows 原子保存 inode 失效）；
      # 改动 anima-brain 源码后执行 `docker compose build anima-brain`，或本地开发复制 docker-compose.override.yml.example
      - ./anima-data:/data/anima
      # Obsidian 单向导出目录（默认挂载本地 ./data/obsidian_export，配置 OBSIDIAN_EXPORT_DIR 后直连指定 Vault）
      - ${OBSIDIAN_EXPORT_DIR:-./data/obsidian_export}:/obsidian

  xiaozhi-esp32-server:
    image: ${XIAOZHI_SERVER_IMAGE:-ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest@sha256:cececd7752e00e044bf9f099751a140834053573bbe6dd55ecbcedcb20c19c25}
    container_name: xiaozhi-esp32-server
    restart: always
    depends_on:
      anima-brain:
        condition: service_healthy
    command: ["python", "/opt/xiaozhi-esp32-server/app/boot.py"]
    env_file:
      # A-1 最小权限：主容器按需接收 18900 与 18787 两个独立环境文件，零令牌文件挂载
      - path: ./secrets/pc_mcp_tokens.env
        required: false
      - path: ./secrets/anima_tokens.env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_MMAP_THRESHOLD_=131072
      - OMP_NUM_THREADS=2
      - HOST_LAN_IP=${HOST_LAN_IP:-127.0.0.1}
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/xiaozhi-esp32-server/data}
      - HOST_VOICES_DIR=${HOST_VOICES_DIR:-}
      - HOST_GSV_WEIGHTS_DIR=${HOST_GSV_WEIGHTS_DIR:-}
      - GSV_MEI_GPT_WEIGHTS=${GSV_MEI_GPT_WEIGHTS:-}
      - GSV_MEI_SOVITS_WEIGHTS=${GSV_MEI_SOVITS_WEIGHTS:-}
      - GSV_MEI_VERSION=${GSV_MEI_VERSION:-}
      - XIAOZHI_BUILD_VERSION=${XIAOZHI_BUILD_VERSION:-dev}
      - XIAOZHI_APP_DIR=/opt/xiaozhi-esp32-server/app
      - XIAOZHI_CONFIG_DIR=/opt/xiaozhi-esp32-server/data
      - XIAOZHI_STATE_DIR=/opt/xiaozhi-esp32-server/state
      - XIAOZHI_VOICES_DIR=/opt/xiaozhi-esp32-server/voices
      - ESP32_AUTH_KEY=${ESP32_AUTH_KEY:-}
      - ESP32_ALLOWED_DEVICES=${ESP32_ALLOWED_DEVICES:-}
      - L3_BACKEND=${L3_BACKEND:-dsh}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # 云端音频 API 密钥与参数（仅注入主容器，绝不注入 anima-brain，维持 A-1 最小权限隔离）
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - OPENAI_AUDIO_API_KEY=${OPENAI_AUDIO_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DOUBAO_APPID=${DOUBAO_APPID:-}
      - DOUBAO_ACCESS_TOKEN=${DOUBAO_ACCESS_TOKEN:-}
      - DOUBAO_ASR_APPID=${DOUBAO_ASR_APPID:-${DOUBAO_APPID:-}}
      - DOUBAO_ASR_ACCESS_TOKEN=${DOUBAO_ASR_ACCESS_TOKEN:-${DOUBAO_ACCESS_TOKEN:-}}
      - DOUBAO_TTS_APPID=${DOUBAO_TTS_APPID:-${DOUBAO_APPID:-}}
      - DOUBAO_TTS_ACCESS_TOKEN=${DOUBAO_TTS_ACCESS_TOKEN:-${DOUBAO_ACCESS_TOKEN:-}}
      - FISHSPEECH_API_KEY=${FISHSPEECH_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID:-}
      - CLOUD_ASR_TIMEOUT_SECONDS=${CLOUD_ASR_TIMEOUT_SECONDS:-20}
      - PC_AUDIO_STREAM_SAMPLE_RATE=${PC_AUDIO_STREAM_SAMPLE_RATE:-}
      - ANIMA_DEVICE_CHARACTER_MAP=${ANIMA_DEVICE_CHARACTER_MAP:-}
      - ANIMA_ISOLATE_CHARACTER_BY_DEVICE=${ANIMA_ISOLATE_CHARACTER_BY_DEVICE:-}
      - NO_PROXY=localhost,127.0.0.1,anima-brain,xiaozhi-anima-brain,xiaozhi-esp32-server,host.docker.internal,.deepseek.com,.siliconflow.cn,.aliyuncs.com,.bytedance.com,.minimaxi.com,.nmc.cn,.modelscope.cn
      - no_proxy=localhost,127.0.0.1,anima-brain,xiaozhi-anima-brain,xiaozhi-esp32-server,host.docker.internal,.deepseek.com,.siliconflow.cn,.aliyuncs.com,.bytedance.com,.minimaxi.com,.nmc.cn,.modelscope.cn
      # 如果容器内无法直连 Google API（未开启全局 TUN 模式），取消下面两行注释并改成你本地软件的代理端口：
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
    ports:
      # 使用 >15000 的高位端口，彻底避开 Windows Hyper-V 动态端口占用区间 (1024-15000)
      - "18000:8000"
      - "18003:8003"
      # 小智语音与音色本地控制台端口 -> http://localhost:18080（仅绑定本机回环，防止局域网暴露）
      - "127.0.0.1:18080:18080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:18080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # A-1 按职责拆分挂载：代码与模板只读，运行态与配置最小权限隔离，secrets/backups/anima-data/宿主机权重永不挂载
      - ./app:/opt/xiaozhi-esp32-server/app:ro
      - ./config:/opt/xiaozhi-esp32-server/config_templates:ro
      - ./config/runtime:/opt/xiaozhi-esp32-server/data
      - ./config/.mcp_server_settings.json:/opt/xiaozhi-esp32-server/data/.mcp_server_settings.json:ro
      - ./state:/opt/xiaozhi-esp32-server/state
      - ./voices:/opt/xiaozhi-esp32-server/voices:ro
      # 轻量 Sherpa-ONNX SenseVoice int8 本地离线语音识别模型（默认，内存仅 ~350MB；需可写以支持首次启动自动下载）
      - ./models/sherpa-onnx-sense-voice:/opt/xiaozhi-esp32-server/models/sherpa-onnx-sense-voice
      # 可选 FunASR PyTorch 模型目录挂载（不遮蔽镜像内置 snakers4_silero-vad，新电脑无 model.pt 也可正常启动）
      - ./models/SenseVoiceSmall:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall
