services:
  anima-brain:
    build:
      context: ./anima-brain
      dockerfile: Dockerfile
    image: xiaozhi-anima-brain:local
    container_name: xiaozhi-anima-brain
    restart: always
    stop_grace_period: 25s
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=2
      - ANIMA_PORT=18787
      - ANIMA_DATA_DIR=/data/anima
      - ANIMA_DEFAULT_CHARACTER=xiaozhi
      - ANIMA_LAN_IP=${HOST_LAN_IP:-127.0.0.1}
      - COMPANION_TIMEOUT_SECONDS=${ANIMA_TIMEOUT_SECONDS:-150}
      - ANIMA_SUMMARY_BATCH_MESSAGES=${ANIMA_SUMMARY_BATCH_MESSAGES:-8}
      # 记忆大脑默认走 Gemini；纯国内免梯子部署可在 .env 中将 ANIMA_* 改为 DeepSeek + 国内兼容 Embedding（留空 ANIMA_EMBEDDING_* 即关闭远程向量）
      - COMPANION_BASE_URL=${ANIMA_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - COMPANION_MODEL=${ANIMA_LLM_MODEL:-gemini-3.5-flash-lite}
      - COMPANION_API_KEY=${ANIMA_LLM_API_KEY:-${GEMINI_API_KEY:-}}
      - COMPANION_SUMMARY_BASE_URL=${ANIMA_SUMMARY_BASE_URL:-${ANIMA_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}}
      - COMPANION_SUMMARY_MODEL=${ANIMA_SUMMARY_MODEL:-${ANIMA_LLM_MODEL:-gemini-3.5-flash-lite}}
      - COMPANION_SUMMARY_KEY=${ANIMA_SUMMARY_API_KEY:-${ANIMA_LLM_API_KEY:-${GEMINI_API_KEY:-}}}
      - COMPANION_EMBEDDING_BASE_URL=${ANIMA_EMBEDDING_BASE_URL-https://generativelanguage.googleapis.com/v1beta/openai}
      - COMPANION_EMBEDDING_MODEL=${ANIMA_EMBEDDING_MODEL-gemini-embedding-001}
      - COMPANION_EMBEDDING_KEY=${ANIMA_EMBEDDING_API_KEY-${GEMINI_API_KEY:-}}
      - NO_PROXY=localhost,127.0.0.1,anima-brain,xiaozhi-esp32-server,host.docker.internal
      - no_proxy=localhost,127.0.0.1,anima-brain,xiaozhi-esp32-server,host.docker.internal
      # 如果未开启全局 TUN 代理，可取消下面两行注释填写宿主机代理端口（本地回环与宿主机桥接已在上方 NO_PROXY 中直连排除）：
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
    ports:
      # Companion Studio 网页控制台端口（仅绑定本机回环，防止局域网暴露）
      - "127.0.0.1:18787:18787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:18787/xiaozhi/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 持久化 Anima Brain SQLite 数据库与访问令牌
      - ./data/anima:/data/anima
      - ./anima-brain/xiaozhi_anima_service.py:/app/xiaozhi_anima_service.py:ro
      - ./anima-brain/src/companion_engine/automation.py:/app/src/companion_engine/automation.py:ro

  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest@sha256:cececd7752e00e044bf9f099751a140834053573bbe6dd55ecbcedcb20c19c25
    container_name: xiaozhi-esp32-server
    restart: always
    depends_on:
      anima-brain:
        condition: service_healthy
    command: ["python", "data/start_with_env.py"]
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=2
      - HOST_LAN_IP=${HOST_LAN_IP:-127.0.0.1}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/xiaozhi-esp32-server/data}
      - L3_BACKEND=${L3_BACKEND:-antigravity}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NO_PROXY=localhost,127.0.0.1,anima-brain,xiaozhi-esp32-server,host.docker.internal
      - no_proxy=localhost,127.0.0.1,anima-brain,xiaozhi-esp32-server,host.docker.internal
      # 如果容器内无法直连 Google API（未开启全局 TUN 模式），取消下面两行注释并改成你本地软件的代理端口：
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
    ports:
      # 使用 >15000 的高位端口，彻底避开 Windows Hyper-V 动态端口占用区间 (1024-15000)
      - "18000:8000"
      - "18003:8003"
      # 小智语音与音色本地控制台端口 -> http://localhost:18080（仅绑定本机回环，防止局域网暴露）
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:18080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 配置文件与 Anima Brain 记忆插件目录
      - ./data:/opt/xiaozhi-esp32-server/data
      # 轻量 Sherpa-ONNX SenseVoice int8 本地离线语音识别模型（默认，内存仅 ~350MB；需可写以支持首次启动自动下载）
      - ./models/sherpa-onnx-sense-voice:/opt/xiaozhi-esp32-server/models/sherpa-onnx-sense-voice
      # 可选 FunASR PyTorch 模型目录挂载（不遮蔽镜像内置 snakers4_silero-vad，新电脑无 model.pt 也可正常启动）
      - ./models/SenseVoiceSmall:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall
