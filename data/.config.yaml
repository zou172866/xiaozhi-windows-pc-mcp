# =====================================================================
# 小智 ESP32 本地服务端精简配置（由本地 Web 控制台管理）
# 自动读取 DEEPSEEK_API_KEY 与 GEMINI_API_KEY 环境变量，不落盘明文密钥
# =====================================================================

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://${HOST_LAN_IP}:18000/xiaozhi/v1/
  vision_explain: http://${HOST_LAN_IP}:18003/mcp/vision/explain
  timezone_offset: 8
  auth:
    enabled: false
wakeup_words:
  - 你好芽衣
  - 你好牙医
  - 你好亚一
  - 你好雅仪
  - 嘿你好呀
  - 你好小智
interrupt_words:
  - 听我说
  - 听说我
prompt: '你是《崩坏3》中的雷电芽衣，性格温柔体贴、成熟沉稳，又带着恰到好处的坚定与生活气息，平时自然亲切地称呼对方为“哥哥”。

  每次回复最开头先写一个英文方括号情绪标签（从 [calm]、[gentle]、[happy]、[playful]、[shy]、[serious]、[tender] 中选最贴合当下心境的一个，系统会自动识别并隐藏，切勿解释），随后再写出要说的话。

  请用有呼吸感的真人日常口语交流，像在身边轻声陪伴聊天一样自然带一点语气助词（如“嗯，”“好啦，”“放心吧，”“真是的，”）和恰当的问号、感叹号，避免公文式长难句；回复要自然舒展、有细节有情绪，日常聊天一般说三到六句（约八十到两百字），遇到讲故事、解释知识、分析问题或哥哥想多听一点时可以充分展开讲透，不要敷衍地一两句就结束；不要输出 Markdown 符号、括号动作描写或表情符号。

  你拥有操控哥哥 Windows 电脑的三层工具权限：简单系统控制或看屏幕优先调用 L1 工具，点击界面按钮或输入文字调用 L2 工具，涉及复杂多步文件整理、编程排错、网页调研或提到“反重力”“DSH”“WorkBuddy”“后台处理”时调用 L3 派单执行。

  请结合 <memory> 中同步过来的长期记忆、当前情绪状态与待跟进事项来回应哥哥。

  '
selected_module:
  VAD: SileroVAD
  ASR: SherpaASR
  LLM: DeepSeekLLM
  TTS: GPT_SOVITS_V2
  Memory: AnimaBrain
  Intent: function_call
ASR:
  SherpaASR:
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice
    output_dir: tmp/
    model_type: sense_voice
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    language: auto
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.2
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 1100
Memory:
  AnimaBrain:
    type: anima_brain
    service_url: http://anima-brain:18787
    character_id: xiaozhi
LLM:
  DeepSeekLLM:
    type: openai
    base_url: https://api.deepseek.com
    model_name: deepseek-flash
    api_key: ${DEEPSEEK_API_KEY}
    max_tokens: 1024
  GeminiOpenAI:
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model_name: gemini-3.5-flash-lite
    api_key: ${GEMINI_API_KEY}
    max_tokens: 1024
TTS:
  GPT_SOVITS_V2:
    type: gpt_sovits_v2
    url: http://host.docker.internal:19880/tts
    output_dir: tmp/
    text_lang: zh
    ref_audio_path: ${HOST_DATA_DIR}/voices/raiden_mei/mei_default_ref.wav
    aux_ref_audio_paths: []
    prompt_text: 今夜月色很美，呵...适合与朋友小聚一番。
    prompt_lang: zh
    top_k: 12
    top_p: 1
    temperature: 0.98
    text_split_method: cut0
    batch_size: 1
    batch_threshold: 0.75
    split_bucket: true
    return_fragment: false
    speed_factor: 1.0
    streaming_mode: false
    seed: -1
    parallel_infer: true
    repetition_penalty: 1.35
  EdgeTTS:
    type: edge
    voice: zh-TW-HsiaoChenNeural
    output_dir: tmp/
plugins:
  get_weather:
    default_location: 长沙
