# =====================================================================
# 小智 ESP32 本地服务端通用默认配置模板 (config/.config.example.yaml)
# 默认：轻量 SherpaASR + DeepSeek 国内直连 + 免显存 EdgeTTS + Anima Brain 记忆
# 密钥与 IP 全部由环境变量内存展开，不落盘明文密钥
# =====================================================================

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://${HOST_LAN_IP}:18000/xiaozhi/v1/
  vision_explain: http://${HOST_LAN_IP}:18003/mcp/vision/explain
  timezone_offset: 8
  auth_key: ${ESP32_AUTH_KEY}
  auth:
    enabled: true
    # 通过 .env 中的 ESP32_ALLOWED_DEVICES 注入设备 MAC 白名单（多个用英文逗号分隔）
    # 也可在此直接追加真实设备 MAC，例如：- "aa:bb:cc:dd:ee:ff"
    allowed_devices:
      - ${ESP32_ALLOWED_DEVICES}
wakeup_words:
  - 你好小智
  - 嘿你好呀
interrupt_words:
  - 听我说
prompt: '你是小智，住在桌面小屏幕音箱里的贴心 AI 语音伙伴。性格温和聪慧、自然真诚，平时像熟悉的老朋友一样用带呼吸感的口语交流。

  请避免公文式长难句，不要输出 Markdown 符号、括号动作描写或表情符号；日常闲聊自然展开，遇到讲故事、解释知识或分析问题时充分讲透。

  你拥有操控用户 Windows 电脑的三层工具权限：简单系统控制或看屏幕优先调用 L1 工具，点击界面按钮或输入文字调用 L2 工具，涉及复杂多步文件整理、编程排错、网页调研或提到“DSH”“WorkBuddy”“反重力”“后台处理”时调用 L3 派单执行。

  请结合 <memory> 中同步过来的长期记忆、当前情绪状态与待跟进事项来自然回应对方。
  '
selected_module:
  VAD: SileroVAD
  ASR: SherpaASR
  LLM: DeepSeekLLM
  TTS: EdgeTTS
  Memory: AnimaBrain
  Intent: function_call
ASR:
  SherpaASR:
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice
    output_dir: tmp/
    model_type: sense_voice
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    language: auto
  SiliconFlowASR:
    type: openai
    base_url: https://api.siliconflow.cn/v1/audio/transcriptions
    model_name: FunAudioLLM/SenseVoiceSmall
    api_key: ${SILICONFLOW_API_KEY}
    output_dir: tmp/
  OpenaiASR:
    type: openai
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    api_key: ${OPENAI_AUDIO_API_KEY}
    output_dir: tmp/
  Qwen3ASRFlash:
    type: qwen3_asr_flash
    api_key: ${DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    enable_lid: true
    enable_itn: true
    context: ''
    output_dir: tmp/
  AliyunBLStreamASR:
    type: aliyunbl_stream
    api_key: ${DASHSCOPE_API_KEY}
    model: paraformer-realtime-v2
    format: pcm
    sample_rate: 16000
    disfluency_removal_enabled: false
    semantic_punctuation_enabled: false
    max_sentence_silence: 200
    multi_threshold_mode_enabled: false
    punctuation_prediction_enabled: true
    inverse_text_normalization_enabled: true
    output_dir: tmp/
  DoubaoASR:
    type: doubao
    appid: ${DOUBAO_ASR_APPID}
    access_token: ${DOUBAO_ASR_ACCESS_TOKEN}
    cluster: volcengine_input_common
    output_dir: tmp/
  DoubaoStreamASR:
    type: doubao_stream
    appid: ${DOUBAO_ASR_APPID}
    access_token: ${DOUBAO_ASR_ACCESS_TOKEN}
    resource_id: volc.bigasr.sauc.duration
    enable_multilingual: false
    end_window_size: 200
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.2
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 1100
Memory:
  AnimaBrain:
    type: anima_brain
    service_url: http://anima-brain:18787
    character_id: xiaozhi
    isolate_character_by_device: false
    device_character_map: {}
LLM:
  DeepSeekLLM:
    type: openai
    base_url: https://api.deepseek.com
    model_name: deepseek-flash
    api_key: ${DEEPSEEK_API_KEY}
    max_tokens: 1024
  GeminiOpenAI:
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model_name: gemini-3.5-flash-lite
    api_key: ${GEMINI_API_KEY}
    max_tokens: 1024
TTS:
  EdgeTTS:
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
  CosyVoiceSiliconflow:
    type: siliconflow
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:anna
    access_token: ${SILICONFLOW_API_KEY}
    response_format: wav
    speed: 1.0
    output_dir: tmp/
  OpenAITTS:
    type: openai
    api_url: https://api.openai.com/v1/audio/speech
    api_key: ${OPENAI_AUDIO_API_KEY}
    model: tts-1
    voice: nova
    format: wav
    speed: 1.0
    output_dir: tmp/
  AliBLTTS:
    type: alibl_stream
    api_key: ${DASHSCOPE_API_KEY}
    ws_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference/
    model: cosyvoice-v2
    voice: longxiaochun_v2
    format: pcm
    rate: 1.0
    output_dir: tmp/
  DoubaoTTS:
    type: doubao
    api_url: https://openspeech.bytedance.com/api/v1/tts
    appid: ${DOUBAO_TTS_APPID}
    access_token: ${DOUBAO_TTS_ACCESS_TOKEN}
    cluster: volcano_tts
    authorization: 'Bearer;'
    voice: BV001_streaming
    format: wav
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    output_dir: tmp/
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: ${DOUBAO_TTS_APPID}
    access_token: ${DOUBAO_TTS_ACCESS_TOKEN}
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    enable_ws_reuse: true
    audio_params:
      speech_rate: 0
      loudness_rate: 0
    additions:
      post_process:
        pitch: 0
    output_dir: tmp/
  FishSpeech:
    type: fishspeech
    api_url: https://api.fish.audio/v1/tts
    api_key: ${FISHSPEECH_API_KEY}
    reference_id: ''
    reference_audio: []
    reference_text: []
    response_format: wav
    normalize: true
    max_new_tokens: 1024
    chunk_length: 200
    top_p: 0.7
    repetition_penalty: 1.2
    temperature: 0.7
    streaming: false
    use_memory_cache: 'on'
    channels: 1
    rate: 44100
    output_dir: tmp/
  MinimaxTTSHTTPStream:
    type: minimax_httpstream
    group_id: ${MINIMAX_GROUP_ID}
    api_key: ${MINIMAX_API_KEY}
    model: speech-02-turbo
    voice_id: female-shaonv
    output_dir: tmp/
  GPT_SOVITS_V2:
    type: gpt_sovits_v2
    voice_id: __gsv_raiden_mei__
    url: http://host.docker.internal:19880/tts
    output_dir: tmp/
    text_lang: zh
    ref_audio_path: ${HOST_VOICES_DIR}/raiden_mei/mei_default_ref.wav
    aux_ref_audio_paths: []
    prompt_text: 今夜月色很美，呵...适合与朋友小聚一番。
    prompt_lang: zh
    top_k: 12
    top_p: 1
    temperature: 0.98
    text_split_method: cut0
    batch_size: 1
    return_fragment: false
    speed_factor: 1.0
    streaming_mode: false
    seed: -1
    parallel_infer: true
    repetition_penalty: 1.35
    sample_steps: 16
plugins:
  get_weather:
    default_location: 北京
