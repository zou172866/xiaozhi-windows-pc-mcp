[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "companion-engine"
version = "0.6.0"
description = "Anima Brain: local-first memory and emotional continuity for AI companions"
authors = [{ name = "Jun Yu Chen" }, { name = "kayllla" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "keyring>=25,<26; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/spearsheep/anima-brain"
Documentation = "https://github.com/spearsheep/anima-brain/tree/main/docs"
Repository = "https://github.com/spearsheep/anima-brain"
Issues = "https://github.com/spearsheep/anima-brain/issues"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
http = ["starlette>=0.47,<1", "uvicorn>=0.34,<1", "mcp==2.3.0"]
calls = ["websockets>=15,<17"]

[project.scripts]
companion = "companion_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/companion_engine"]

[tool.hatch.build.targets.sdist]
exclude = ["/examples/showcase/node_modules", "/examples/showcase/dist", "/examples/showcase/*.tsbuildinfo"]
include = [
  "/src", "/tests", "/examples", "/scripts", "/docs", "/ui/*.js", "/ui/*.mjs",
  "/ui/*.css", "/ui/*.html", "/ui/README.md", "/ui/package.json", "/ui/package-lock.json",
  "/README.md", "/README.zh-CN.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/CONTRIBUTING.md", "/SECURITY.md",
  "/CHANGELOG.md", "/config.example.env", "/constraints-tested.txt", "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
