<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice message</title><style>/* HOST_THEME */
article{max-width:420px;width:100%}.message{min-width:0}.name{display:block;font-size:12px;color:var(--muted);margin:0 0 8px}.row{display:flex;align-items:center;gap:8px}.bubble{display:flex;align-items:center;justify-content:space-between;gap:24px;width:240px;max-width:100%;min-height:52px;padding:12px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}.signal{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.duration{font-size:14px;font-variant-numeric:tabular-nums}.spinner{display:none;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%}.bubble[data-state=loading] .spinner{display:block}.bubble[data-state=loading] .signal{display:none}.download{display:grid;place-items:center;width:44px;height:44px;flex:none;color:var(--muted);border-radius:var(--radius)}.download:hover{background:var(--surface)}.download svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.status[data-error=true]{color:var(--color-text-danger,light-dark(#b42318,#ff9690))}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}@media(prefers-reduced-motion:no-preference){.bubble[data-state=playing] .arc{animation:voice 1.2s infinite}.bubble[data-state=playing] .arc:last-child{animation-delay:.2s}.spinner{animation:spin .8s linear infinite}@keyframes voice{0%,100%{opacity:.25}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}}
</style></head><body>
<article aria-label="Voice message"><div id="avatar" class="avatar" hidden aria-hidden="true">·</div><div class="message">
<span id="name" class="name">Companion</span><div class="row">
<button id="play" class="bubble" type="button" disabled data-state="connecting" aria-label="Connecting voice message" aria-pressed="false">
<svg class="signal" viewBox="0 0 24 28" aria-hidden="true"><path d="M4 13v2"/><path class="arc" d="M9 9a8 8 0 0 1 0 10"/><path class="arc" d="M14 5a14 14 0 0 1 0 18"/></svg><span class="spinner" aria-hidden="true"></span><span id="duration" class="duration" aria-hidden="true">···</span></button>
<a id="download" class="download" hidden aria-label="Save audio" title="Save audio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a>
</div><p id="status" class="status" role="status" aria-live="polite"></p><span id="announcement" class="sr-only" aria-live="polite"></span>
</div><audio id="audio" preload="metadata" hidden></audio></article>
<script type="module">/* BUNDLED_PLAYER */</script></body></html>
