<text x="52" y="654" class="body muted" >Original evidence stays available for checking</text>
<rect x="512" y="557" width="456" height="129" rx="12" fill="#eff3ed" stroke="#d5ddd5"/>
<text x="532" y="591" class="heading" >Core notebook</text>
<text x="532" y="626" class="body muted" >Merged user notes + separate character core</text>
<text x="532" y="654" class="body muted" >Compact continuity, refreshed after corrections</text>
<text x="32" y="733" class="label muted" >TWO CONTINUITY LOOPS</text>
<rect x="32" y="754" width="576" height="171" rx="12" fill="#e7eee4" stroke="#d5ddd5"/>
<text x="52" y="790" class="heading" >Consolidation cycle</text>
<text x="52" y="826" class="body" >Summarize → cite → reindex → refresh</text>
<text x="52" y="857" class="body muted" >Configured worker or host; original sources are retained</text>
<text x="52" y="888" class="body muted" >Corrections invalidate affected derived summaries</text>
