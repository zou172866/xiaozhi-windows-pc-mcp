<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" lang="en" role="img" aria-labelledby="title desc">
<title id="title">Inside Anima Brain</title>
<desc id="desc">A message becomes retrieved context, a reply and a validated commit. Original evidence, semantic facts, cited episodes and core notes feed future turns. Consolidation updates derived memory; emotional state evolves separately. Evidence and archives use different rankings.</desc>
