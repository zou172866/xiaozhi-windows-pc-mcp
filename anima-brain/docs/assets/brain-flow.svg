<text x="32" y="989" class="label muted" >DIFFERENT RETRIEVAL PATHS, DIFFERENT SCORES</text>
<text x="32" y="1023" class="body" >Evidence: lexical + contextual vectors + note vectors → RRF, k = 40</text>
<text x="32" y="1055" class="body" >Fact / episode archive: 0.60 relevance + 0.25 recency + 0.15 importance</text>
<text x="32" y="1100" class="body" style="font-size:16px;fill:#5e6c65">Provider-dependent features are configurable. Full formulas and limits: docs/brain-flow.md</text>
