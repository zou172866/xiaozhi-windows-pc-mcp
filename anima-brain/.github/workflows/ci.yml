name: tests-and-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,http]' build
      - run: ruff check src tests examples scripts
      - run: pytest -q
      - run: python examples/offline_demo.py
      - run: python -m build
      - run: python scripts/check_release.py
      - name: Install wheel outside checkout
        run: |
          python -m venv /tmp/companion-wheel
          /tmp/companion-wheel/bin/pip install "$(ls dist/*.whl)"
          cd /tmp
          /tmp/companion-wheel/bin/python -c 'import importlib.util; from companion_engine import CompanionBrain; assert importlib.util.find_spec("starlette") is None; assert importlib.util.find_spec("mcp") is None'
          cd "$GITHUB_WORKSPACE"
          /tmp/companion-wheel/bin/pip install "$(ls dist/*.whl)[http]" pytest
          cd /tmp
          /tmp/companion-wheel/bin/python -c 'from companion_engine import CompanionBrain, Settings; print("wheel imports OK")'
          /tmp/companion-wheel/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_sdk_multimodal.py" "$GITHUB_WORKSPACE/tests/test_brain.py" --import-mode=importlib -q
          /tmp/companion-wheel/bin/pip check
